name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Lock file in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Re-compile requirements.txt from requirements.in
        run: |
          pip install uv==0.11.32
          # uv keeps the versions already in requirements.txt where they still
          # satisfy requirements.in, so this only changes the file when
          # requirements.in changed and the lock was not regenerated.
          uv pip compile requirements.in --universal --python-version 3.11 -o requirements.txt
          git diff --exit-code requirements.txt || {
            echo "::error::requirements.txt is out of date. Run: uv pip compile requirements.in --universal --python-version 3.11 -o requirements.txt"
            exit 1
          }

  app:
    name: Run app (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the devcontainer; 3.13 catches breakage on newer Python.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.2.0

      - name: Run app script with AppTest
        run: pytest -v tests

      - name: Start server and check health endpoint
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo; echo "Server healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in 30s"; cat streamlit.log; exit 1
